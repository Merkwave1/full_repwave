# version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: repwave_share_nginx
    restart: always
    ports:
      - "8082:80"
    volumes:
      - ./api:/var/www/html/api
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
      - react
    networks:
      - rep_network
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rep.rule=Host(`your-domain.example`)"
      - "traefik.http.routers.rep.entrypoints=websecure"
      - "traefik.http.routers.rep.tls.certresolver=cloudflare"
      - "traefik.http.services.rep.loadbalancer.server.port=80"
      - "traefik.docker.network=webproxy"

  react:
    build:
      context: ./RepWave
      dockerfile: Dockerfile
    container_name: repwave_share_react
    restart: always
    volumes:
      - ./RepWave:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    networks:
      - rep_network
    ports:
      - "5173:5173"

  repwave:
    build:
      context: ./repwaveNewApi
      dockerfile: Dockerfile
    container_name: repwave_new_react
    restart: always
    volumes:
      - ./repwaveNewApi:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - DOTNET_API_TARGET=http://dotnet:8080
    networks:
      - rep_network
    ports:
      - "5174:5174"
    depends_on:
      - dotnet

  dotnet:
    build:
      context: ./api/dotnet
      dockerfile: src/RepWave.Api/Dockerfile
    container_name: repwave_dotnet_api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__MasterConnection=Host=postgres;Port=5432;Database=repwave_master;Username=repwave_user;Password=repwave_pass
      - JwtSettings__Key=docker_dev_jwt_secret_key_min_32_chars_long
      - JwtSettings__Issuer=RepWaveApi
      - JwtSettings__Audience=RepWaveClient
      - JwtSettings__ExpiryDays=30
      - TenantRegistration__ApiKey=docker_dev_admin_api_key_123
      - AllowedOrigins__0=http://localhost:5174
      - AllowedOrigins__1=http://localhost:8082
      - AllowedOrigins__2=http://repwave:5174
    ports:
      - "5050:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rep_network

  postgres:
    image: postgres:16-alpine
    container_name: repwave_postgres
    restart: always
    environment:
      POSTGRES_DB: repwave_master
      POSTGRES_USER: repwave_user
      POSTGRES_PASSWORD: repwave_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repwave_user -d repwave_master"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rep_network
    ports:
      - "5432:5432"

  php:
    image: php:8.1-fpm
    container_name: repwave_share_php
    restart: always
    volumes:
      - ./api:/var/www/html/api
    environment:
      - TZ=Africa/Cairo
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - rep_network
    command: sh -c "docker-php-ext-install mysqli pdo pdo_mysql && php-fpm"

  mysql:
    image: mysql:8.0
    container_name: repwave_share_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: template_company_db
      MYSQL_USER: template_company_user
      MYSQL_PASSWORD: template_company_pass
      TZ: Africa/Cairo
    volumes:
      - mysql_data:/var/lib/mysql
      # Init scripts run alphabetically on a FRESH volume only:
      - ./api/clients/template_company/setup_test_database.sql:/docker-entrypoint-initdb.d/01_template_schema.sql:ro
      - ./api/clients/demo_company/migrations/setup_demo_database.sql:/docker-entrypoint-initdb.d/02_demo_setup.sql:ro
      - ./api/clients/demo_company/migrations/001_trial_schema.sql:/docker-entrypoint-initdb.d/03_trial_schema.sql:ro
      - ./api/clients/demo_company/migrations/demo_seed.sql:/docker-entrypoint-initdb.d/04_demo_seed.sql:ro
      # Migrations folder mounted so reset_demo.sh can run inside the mysql container
      # (mysql container has mysql client; php container does not)
      - ./api/clients/demo_company/migrations:/demo_migrations:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rep_network
    ports:
      - "3306:3306"

networks:
  rep_network:
    external: true
    name: repwave_share_network
  proxy:
    external: true
    name: webproxy
volumes:
  mysql_data:
  postgres_data:
